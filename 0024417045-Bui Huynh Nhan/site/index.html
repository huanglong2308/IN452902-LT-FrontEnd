        type="button"
        class="menu-toggle"
        aria-expanded="false"
        aria-controls="main-nav"

      <nav id="main-nav" class="main-nav">

    <main>
      <h1>Sự kiện sắp diễn ra</h1>

      <form id="search-form">
        <label for="keyword" class="sr-only">Từ khoá</label>

          name="keyword"

      <p id="status"></p>

      <div id="event-list">
        <article class="card">
          <img src="img/event.svg" alt="Hình minh hoạ Workshop Git & GitHub" />

            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000001"

            >
          </h2>
          <p>
            <time datetime="2026-09-12T01:00:00.000Z">08:00 12/09/2026</time>
          </p>
          <p>Phòng máy A3.201</p>
          <p>Còn 12/40 chỗ</p>
        </article>

        <article class="card">
          <img src="img/event.svg" alt="Hình minh hoạ Hackathon EduHub" />
          <h2>
            <a href="event-detail.html?id=22222222-2222-4222-8222-000000000004"
              >Hackathon EduHub 24 giờ</a
            >
          </h2>
          <p>
            <time datetime="2026-12-19T01:00:00.000Z">08:00 19/12/2026</time>
          </p>
          <p>Phòng máy A3.205</p>
          <p><span class="badge-full">Hết chỗ</span></p>
        </article>
      </div>

    <footer class="site-footer">
